# pocketpanel — configuración. Lo normal es cambiarla desde la app (Estado → ⚙ Módulos), que la reescribe
# conservando estos comentarios. Si la editas a mano, aplica con: docker compose up -d --force-recreate

name: mi-servidor              # título en la app y en los avisos
timezone: Europe/Madrid        # para las tareas programadas
disks: []                      # puntos de montaje a mostrar (admite *): ["/", "/mnt/*"]; vacío = discos reales
disk_alert_percent: 90         # avisar cuando un disco pase de este %
push_contact: mailto:admin@example.com   # contacto para las notificaciones push (lo pide el estándar)
host_env: {}                   # variables extra para los comandos que se ejecutan en el host

# Ajustes por contenedor (opcional): nombre bonito, puerto/URL del botón "Abrir", icono, ocultarlo
services: {}
#  jellyfin: {name: Jellyfin, port: 8096}
#  nextcloud-db: {hidden: true}
#  homeassistant: {name: Home Assistant, url: "https://ha.example.com", icon: "https://…/ha.png"}

modules:
  terminal:                    # terminal en el host por SSH (bash y tmux)
    enabled: true
  actions:                     # botones con comandos de actions.yml
    enabled: true
  updates:                     # buscar imágenes nuevas cada día y actualizar contenedores (con vuelta atrás)
    enabled: true
    check_at: "05:30"

  packages:                    # paquetes del sistema (apt) por actualizar y actualizarlos desde Estado
    enabled: false             # en sudoers, sin contraseña: /usr/bin/apt update, /usr/bin/apt upgrade -y

  claude:                      # chat con Claude Code en el host + informe diario por push
    enabled: false             # necesita `claude` instalado y con sesión iniciada en el servidor
    home: ""                   # HOME con el que usas claude; vacío = el de tu usuario
    cwd: ""                    # carpeta donde trabaja; vacío = igual que home
    bin: ""                    # vacío = <home>/.local/bin/claude
    permission_mode: ""        # el chat no puede preguntarte: para que ejecute comandos pon "auto" o "bypassPermissions"
                               # (vacío = lo que diga tu configuración de Claude Code)
    report_at: "09:00"         # null = sin informe diario
    report_notes: ""           # cosas que Claude debe saber al revisar ("el disco /mnt/viejo al 95% es normal")
    diagnosis: ""              # prompt del botón Diagnóstico; vacío = uno genérico

  backups:                     # copia incremental diaria (rsync + hardlinks) a otra máquina por SSH
    enabled: false
    source: /srv/appdata       # carpeta del host a copiar; cada subcarpeta se puede restaurar por separado
    dest: usuario@nas:/backups/pocketpanel
    ssh_key: ""                # clave para entrar en el destino (vacío = la que use tu usuario por defecto)
    ssh_options: ""            # p. ej. "-p 2222"
    at: "04:00"
    keep_days: 7
    excludes: [cache/, Cache/, logs/, log/, "*.log", transcodes/]

  raid:                        # estado de un RAID mdadm (+ SMART si hay permisos)
    enabled: false
    device: /dev/md0
    ssh: ""                    # vacío = en este servidor; o "root@nas" si el RAID está en otra máquina
    ssh_options: ""
    sudo: false                # en local: usar `sudo -n` para mdadm/smartctl (necesita regla en sudoers)

  files:                       # gestor de archivos del host por SFTP (el mismo SSH): copiar/pegar, subir, descargar…
    enabled: false
    roots: ["~"]               # lo único que se puede ver y tocar; p. ej. ["~", "/mnt"]

  sites:                       # webs que deben responder + días que le quedan al certificado, con avisos
    enabled: false
    urls: []                   # ["https://midominio.com", "http://127.0.0.1:8096"]
    interval: 5                # minutos entre comprobaciones
    cert_warn_days: 14

  downloads:                   # qBittorrent, Sonarr y Radarr (claves/contraseñas desde la app: se guardan en data/)
    enabled: false
    qbittorrent_url: ""        # http://127.0.0.1:8080
    sonarr_url: ""             # http://127.0.0.1:8989
    radarr_url: ""             # http://127.0.0.1:7878
    notify_finished: true      # aviso push cuando termina una descarga

  stocks:                      # cartera de bolsa: recomendaciones por reglas, seguimiento y avisos por Telegram
    enabled: false             # al activarlo descarga curl_cffi (~38 MB, en data/deps); al apagarlo se borra
    broker: Trade Republic
    max_positions: 3
    commission: "1"            # € por operación: se descuenta del efectivo
    alerts: true               # avisar cuando cambie una recomendación
    alert_every: 30            # minutos
    digest_at: "07:00"         # resumen diario por Telegram (null: sin resumen)
    telegram_chat: ""          # el token del bot se pone desde la app (se guarda aparte, en data/)

  jellyfin:                    # cuentas e invitaciones de Jellyfin a través de jfa-go
    enabled: false             # usuario/contraseña de jfa-go: desde la app (se guardan aparte, en data/)
    jfa_url: http://127.0.0.1:8056
    jellyfin_url: http://127.0.0.1:8096
    public_url: ""             # web pública de jfa-go (enlaces de invitación)
    db: ""                     # ruta a jellyfin.db para ver fechas de alta (opcional, necesita sqlite3)

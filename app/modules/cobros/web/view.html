<section id="view-cobros" class="view" data-view="cobros" hidden>
  <header class="topbar">
    <h1>Cobros</h1>
    <div class="cb-tools">
      <a id="cb-folder" class="btn btn-sm" hidden>Facturas</a>
    </div>
  </header>
  <div class="scroll cb-page">
    <div class="cb-top">
      <section class="cb-card">
        <header class="cb-head">
          <div class="seg" id="cb-tabs" role="tablist">
            <button class="seg-btn" type="button" data-tab="sum">Resumen</button>
            <button class="seg-btn" type="button" data-tab="cli">Clientes</button>
            <button class="seg-btn" type="button" data-tab="svc">Servicios</button>
          </div>
          <button id="cb-hub-add" class="btn btn-sm" type="button"></button>
        </header>
        <div id="cb-hub" class="cb-body"></div>
      </section>
      <section class="cb-card">
        <header class="cb-head">
          <div class="cb-title"><span>Últimos movimientos</span></div>
          <div class="seg" id="cb-range">
            <button class="seg-btn" type="button" data-range="month">Mes</button>
            <button class="seg-btn" type="button" data-range="year">Año</button>
            <button class="seg-btn" type="button" data-range="all">Todo</button>
          </div>
        </header>
        <div id="cb-moves" class="cb-body"></div>
      </section>
    </div>
    <section class="cb-card cb-board">
      <header class="cb-head">
        <div class="cb-title">
          <h2 id="cb-board-title"></h2>
          <span id="cb-board-sub" class="muted small"></span>
        </div>
        <div class="cb-board-tools">
          <span id="cb-board-tool"></span>
          <div class="seg cb-nav">
            <button id="cb-prev" class="seg-btn" type="button" aria-label="Anterior">‹</button>
            <span id="cb-pos" class="cb-pos"></span>
            <button id="cb-next" class="seg-btn" type="button" aria-label="Siguiente">›</button>
          </div>
        </div>
      </header>
      <div id="cb-board"></div>
    </section>
  </div>
</section>

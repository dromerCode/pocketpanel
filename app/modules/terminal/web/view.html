<section id="view-terminal" class="view" data-view="terminal" hidden>
  <header class="topbar term-bar">
    <div id="term-tabs" class="term-tabs" role="tablist" aria-label="Sesiones"></div>
    <button id="term-new" class="icon-btn" title="Nueva sesión" aria-label="Nueva sesión">+</button>
    <button id="term-tmux" class="btn btn-sm" data-module="claude" title="tmux con Claude">tmux claude</button>
    <button id="term-reconnect" class="icon-btn" title="Reconectar" aria-label="Reconectar">↻</button>
  </header>
  <div id="term" class="term"></div>
  <div class="keys" id="term-keys">
    <button data-k="esc">Esc</button><button data-k="tab">Tab</button><button data-k="ctrl" class="mod">Ctrl</button>
    <button data-k="up">↑</button><button data-k="down">↓</button><button data-k="left">←</button><button data-k="right">→</button>
    <button data-k="|">|</button><button data-k="~">~</button><button data-k="/">/</button><button data-k="-">-</button>
  </div>
</section>

<div class="section-head">
  <h2 class="section-title">Paquetes</h2>
  <span id="pkg-badge" class="badge"></span>
</div>
<div class="card pkg">
  <div id="pkg-sum" class="pkg-sum"><span class="muted small">Cargando…</span></div>
  <div id="pkg-list"></div>
  <div class="pkg-btns">
    <button id="pkg-check" class="btn btn-sm" type="button" title="sudo apt update">Buscar</button>
    <button id="pkg-up" class="btn btn-sm btn-primary" type="button" hidden>Actualizar</button>
  </div>
</div>
